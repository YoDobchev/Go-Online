# analysis_fast.cfg
# Minimal-ish config for KataGo C++ analysis engine: "./katago analysis"

# Logs
logDir = analysis_logs

# Report winrates from Black's perspective (so "winrate" = P(Black wins))
reportAnalysisWinratesAs = BLACK

# Speed/quality tradeoff: lower = faster, noisier.
# You can override per-request, but this is the default.
maxVisits = 100
# maxTime = 0.25   # optional: cap seconds per request instead of/in addition to maxVisits

# Concurrency:
# - numAnalysisThreads: how many positions can be analyzed in parallel
# - numSearchThreadsPerAnalysisThread: threads per position
# For low-latency single-position queries, keep analysisThreads low and searchThreads moderate.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4

# NN batching (mostly matters for GPU, but safe to leave reasonable)
nnMaxBatchSize = 16

# NN cache (reduce these to save RAM)
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 15

# Determinism vs tiny strength gain:
# true = random symmetries; false = a bit more stable outputs run-to-run
nnRandomize = false

# If you're using the Eigen (CPU-only) KataGo build, you can optionally set:
# numEigenThreadsPerModel = 4
